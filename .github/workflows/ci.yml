name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build the warehouse
        run: "PYTHONPATH=src python -m hotel_dw.build --db :memory:"
      - name: Run data tests
        run: pytest
